<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Сквош-тренировки</title>
  <!-- Обязательный скрипт Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- TailwindCSS через CDN: без сборщиков Node.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ===== Тема из Telegram (автоматически светлая/тёмная) ===== */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8a8a8e);
      --accent: var(--tg-theme-button-color, #2ea6ff);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --link: var(--tg-theme-link-color, var(--tg-theme-button-color, #2ea6ff));
      --destructive: var(--tg-theme-destructive-text-color, #ff3b30);
      --separator: var(--tg-theme-section-separator-color, rgba(128,128,128,.16));
      --radius: 16px;
      --tabbar-h: 58px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px; line-height: 1.35;
      -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
    }
    .app { max-width: 520px; margin: 0 auto; min-height: 100vh; }

    /* ===== Верхняя панель ===== */
    .app-header {
      position: sticky; top: 0; z-index: 20;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      background: var(--tg-theme-header-bg-color, var(--bg));
      border-bottom: 1px solid var(--separator);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .app-title { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }

    /* ===== Контент ===== */
    .app-main { padding: 14px 16px calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom)); }

    .section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      color: var(--hint); margin: 0 2px 10px;
    }

    /* ===== Карточки ===== */
    .card { background: var(--secondary); border-radius: var(--radius); padding: 16px; }
    .card + .card { margin-top: 12px; }

    /* ===== Кнопки ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; padding: 0 16px; border: 0; border-radius: 12px;
      font: inherit; font-weight: 600; cursor: pointer;
      background: var(--secondary); color: var(--link);
      transition: transform .06s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.975); }
    .btn:disabled { opacity: .5; pointer-events: none; }
    .btn--primary { background: var(--accent); color: var(--accent-text); }
    .btn--danger { background: rgba(255,59,48,.14); color: var(--destructive); }
    .btn--block { width: 100%; }
    .btn--sm { min-height: 38px; font-size: 14px; border-radius: 10px; padding: 0 12px; }
    .btn > svg { width: 20px; height: 20px; flex: none; }

    .icon-btn {
      flex: none; width: 40px; height: 40px; border: 0; border-radius: 11px;
      background: transparent; color: var(--destructive);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn:active { background: rgba(120,120,128,.16); }
    .icon-btn svg { width: 22px; height: 22px; }

    /* ===== Переключатель ===== */
    .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 31px; background: rgba(120,120,128,.32); transition: background .2s; }
    .switch span::before {
      content: ""; position: absolute; height: 27px; width: 27px; left: 2px; top: 2px;
      background: #fff; border-radius: 50%; transition: transform .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(20px); }

    /* ===== Бейджи ===== */
    .badge {
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
      font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
    }
    .badge--success { background: rgba(52,199,89,.16); color: #2fa84f; }
    .badge--warn { background: rgba(255,159,10,.18); color: #c77700; }
    .badge--muted { background: rgba(120,120,128,.16); color: var(--hint); }

    /* ===== Аватарки (инициал как фолбэк, картинка кладётся сверху) ===== */
    .avatar {
      position: relative; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff; user-select: none;
      background: linear-gradient(135deg, #5aa9ff, #2f6bff);
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-stack { display: flex; align-items: center; }
    .avatar-stack .avatar { margin-left: -11px; box-shadow: 0 0 0 2px var(--secondary); }
    .avatar-stack .avatar:first-child { margin-left: 0; }
    .avatar--sm { width: 30px; height: 30px; font-size: 12px; }

    /* ===== Тренировка ===== */
    .t-top { display: flex; gap: 12px; align-items: flex-start; }
    .t-time { font-size: 22px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; min-width: 56px; font-variant-numeric: tabular-nums; }
    .t-info { flex: 1; min-width: 0; }
    .t-title { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-meta { font-size: 13px; color: var(--hint); margin-top: 2px; }
    .t-occ { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
    .t-occ b { font-size: 18px; }
    .t-occ .lbl { display: block; font-size: 11px; color: var(--hint); }
    .t-people { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-width: 0; }
    .t-names { font-size: 13px; color: var(--hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-actions { margin-top: 12px; display: flex; gap: 8px; }
    .t-actions-col { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }

    .t-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    /* ===== День ===== */
    .day { margin-bottom: 20px; }
    .day-label {
      position: sticky; top: calc(env(safe-area-inset-top) + 48px); z-index: 10;
      background: var(--bg); padding: 8px 2px 8px; margin: 0 -2px 8px;
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--hint);
    }

    /* ===== Полоса заполнения (тренер) ===== */
    .bar { height: 6px; border-radius: 3px; background: rgba(120,120,128,.2); overflow: hidden; margin-top: 12px; }
    .bar__fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }

    /* ===== Формы ===== */
    .field { display: block; margin-bottom: 12px; }
    .label { display: block; font-size: 13px; color: var(--hint); font-weight: 500; margin-bottom: 6px; }
    .input {
      width: 100%; min-height: 48px; padding: 12px; border-radius: 12px;
      border: 1px solid var(--separator); background: var(--bg); color: var(--text);
      font: inherit; font-size: 16px; appearance: none;
    }
    .input:focus { outline: none; border-color: var(--accent); }
    textarea.input { min-height: 86px; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .inline-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* ===== Сегментированный переключатель ===== */
    .segmented { display: flex; background: var(--secondary); border-radius: 12px; padding: 3px; margin-bottom: 16px; }
    .segmented button {
      flex: 1; min-height: 38px; border: 0; border-radius: 9px; background: transparent;
      color: var(--hint); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .segmented button.is-active { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    /* ===== Строка участника / подсказки ===== */
    .p-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--separator); }
    .p-row:first-child { border-top: 0; }
    .hint { font-size: 13px; color: var(--hint); }
    .hm { display: flex; align-items: center; gap: 6px; color: var(--hint); font-size: 13px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      border: 0; border-radius: 999px; padding: 8px 12px; background: var(--secondary);
      color: var(--link); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .chip:active { transform: scale(.96); }
    .deleted-card { opacity: .72; }

    /* ===== Бейдж «менеджер» ===== */
    .badge--level { background: rgba(94,92,230,.16); color: #5e5ce6; }

    /* ===== Блок тренера в карточке (тап -> написать) ===== */
    .t-coach {
      display: flex; align-items: center; gap: 12px;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--separator);
      cursor: pointer;
    }
    .t-coach:active { opacity: .65; }
    .t-coach__text { flex: 1; min-width: 0; }
    .t-coach__name { font-weight: 600; font-size: 14.5px; }
    .t-coach__bio {
      font-size: 12.5px; color: var(--hint); margin-top: 2px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .t-coach__action {
      flex: none; display: inline-flex; align-items: center; gap: 4px;
      font-size: 12.5px; font-weight: 600; color: var(--link); white-space: nowrap;
    }
    .t-coach__action svg { width: 16px; height: 16px; }

    /* ===== Профиль тренера (страница) ===== */
    .coach-row { display: flex; align-items: center; gap: 10px; }
    .coach-name { font-weight: 600; font-size: 15px; }
    .coach-bio { font-size: 13px; color: var(--hint); margin-top: 2px; line-height: 1.35; }

    /* ===== Нижняя навигация ===== */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; max-width: 520px; margin: 0 auto;
      background: var(--tg-theme-header-bg-color, var(--bg));
      border-top: 1px solid var(--separator);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      flex: 1; min-height: var(--tabbar-h);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--hint); text-decoration: none; font-size: 11px; font-weight: 600;
    }
    .tab svg { width: 25px; height: 25px; }
    .tab.is-active { color: var(--accent); }

    /* ===== FAB (тренер) ===== */
    .fab {
      position: fixed; z-index: 35;
      bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
      right: max(16px, calc(50vw - 260px + 16px));
      width: 58px; height: 58px; border: 0; border-radius: 50%;
      background: var(--accent); color: var(--accent-text);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(0,0,0,.28); cursor: pointer;
      transition: transform .08s ease;
    }
    .fab:active { transform: scale(.93); }
    .fab svg { width: 28px; height: 28px; }

    /* ===== Bottom sheet ===== */
    .sheet { position: fixed; inset: 0; z-index: 50; display: none; }
    .sheet.is-open { display: block; }
    .sheet__backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .22s; }
    .sheet.is-open .sheet__backdrop { opacity: 1; }
    .sheet__panel {
      position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
      background: var(--bg); border-radius: 22px 22px 0 0;
      padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
      max-height: 92vh; overflow-y: auto;
      transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
    }
    .sheet.is-open .sheet__panel { transform: translateY(0); }
    .sheet__handle { width: 40px; height: 5px; border-radius: 3px; background: var(--separator); margin: 6px auto 14px; }
    .sheet__title { font-size: 19px; font-weight: 700; margin: 0 0 16px; }

    /* ===== Тост ===== */
    .toast {
      position: fixed; left: 50%; z-index: 60;
      bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
      transform: translateX(-50%) translateY(16px);
      display: flex; align-items: center; gap: 12px; justify-content: center;
      background: rgba(28,28,30,.95); color: #fff;
      padding: 11px 16px; border-radius: 13px; font-size: 14px; max-width: 90%; text-align: center;
      opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s;
    }
    .toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast__action {
      flex: none; border: 0; background: transparent; color: #4da3ff;
      font: inherit; font-weight: 700; cursor: pointer; padding: 2px 4px;
    }

    /* ===== Пустое состояние / скелетон ===== */
    .empty { text-align: center; padding: 48px 16px; color: var(--hint); }
    .empty svg { width: 44px; height: 44px; opacity: .5; margin-bottom: 10px; }
    .skeleton {
      height: 104px; border-radius: var(--radius);
      background: linear-gradient(90deg, var(--secondary) 25%, rgba(120,120,128,.12) 37%, var(--secondary) 63%);
      background-size: 400% 100%; animation: sk 1.3s ease infinite;
    }
    .skeleton + .skeleton { margin-top: 12px; }
    @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">{% block header %}Сквош{% endblock %}</div>
      <div class="app-header__right">{% block header_right %}{% endblock %}</div>
    </header>
    <main class="app-main">{% block content %}{% endblock %}</main>
  </div>

  <!-- Нижняя навигация -->
  <nav class="tabbar">
    <a class="tab" href="/" data-tab="player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M8 2.8v3.4M16 2.8v3.4M3.2 9.5h17.6"/>
      </svg>
      <span>Расписание</span>
    </a>
    <a class="tab" href="/coach" data-tab="coach" id="tab-coach">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="3.5" width="14" height="17.5" rx="3"/><path d="M9.2 3.5h5.6M8.5 9h7M8.5 13h7M8.5 17h4.5"/>
      </svg>
      <span>Тренер</span>
    </a>
  </nav>

  <div id="toast" class="toast"></div>

  <!-- Bottom sheet: добавление в календарь (общий для страниц) -->
  <div class="sheet" id="cal-sheet">
    <div class="sheet__backdrop" data-cal-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true">
      <div class="sheet__handle"></div>
      <h2 class="sheet__title" id="cal-title">Добавить в календарь</h2>
      <div class="hint" id="cal-when" style="margin:-6px 0 16px"></div>
      <button class="btn btn--primary btn--block" id="cal-ics" style="margin-bottom:10px">Скачать .ics (Apple / Android)</button>
      <button class="btn btn--block" id="cal-google">Google Календарь</button>
    </div>
  </div>

  <script>
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready(); tg.expand();
        tg.setHeaderColor && tg.setHeaderColor('bg_color');
        tg.setBackgroundColor && tg.setBackgroundColor('bg_color');
        tg.enableClosingConfirmation && tg.enableClosingConfirmation();
      } catch (e) { /* старые версии клиента */ }
    }

    // initData строго из Telegram Web App.
    const fromTg = tg ? (tg.initData || '') : '';
    {% if allow_dev_init_data %}
    // DEV-режим (ALLOW_DEV_INIT_DATA=true): локальное превью вне Telegram.
    // Подпись всё равно проверяется на сервере HMAC-SHA256 — подделать нельзя.
    const fromUrl = new URLSearchParams(location.search).get('initData') || '';
    const fromStore = sessionStorage.getItem('initData') || '';
    const INIT_DATA = fromTg || fromUrl || fromStore;
    if (INIT_DATA) sessionStorage.setItem('initData', INIT_DATA);
    {% else %}
    const INIT_DATA = fromTg;
    {% endif %}
    const DEV_INIT_DATA_ENABLED = {% if allow_dev_init_data %}true{% else %}false{% endif %};

    function haptic(style) {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) {}
    }
    function hapticNotify(kind) {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
    }

    function toast(message, action) {
      const el = document.getElementById('toast');
      el.innerHTML = '';
      const text = document.createElement('span');
      text.textContent = message;
      el.appendChild(text);
      if (action) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toast__action';
        btn.textContent = action.label;
        btn.addEventListener('click', () => {
          el.classList.remove('is-show');
          clearTimeout(el._t);
          action.onClick();
        });
        el.appendChild(btn);
      }
      el.classList.add('is-show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('is-show'), action ? 5200 : 2600);
    }

    async function api(path, method = 'GET', body = null) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json', 'X-Init-Data': INIT_DATA },
        body: body ? JSON.stringify(body) : null,
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        const err = new Error(data.error || data.detail || ('Ошибка ' + res.status));
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // Аватар: цветной круг с инициалом; картинка грузится поверх, при ошибке удаляется.
    function avatarHtml(name, url, small) {
      const initial = esc((name || '?').trim().charAt(0).toUpperCase());
      return `<span class="avatar ${small ? 'avatar--sm' : ''}">${initial}` +
             `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
    }

    // Даты по-русски.
    const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    const WD = ['вс','пн','вт','ср','чт','пт','сб'];
    function fmtDay(iso) {
      const d = new Date(iso + 'T00:00:00');
      const t = new Date();
      const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
      const diff = Math.round((d - today) / 86400000);
      const base = WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
      if (diff === 0) return 'Сегодня · ' + base;
      if (diff === 1) return 'Завтра · ' + base;
      return base;
    }

    // «270» -> «4 ч 30 мин»
    function fmtOffset(min) {
      min = Math.max(0, parseInt(min, 10) || 0);
      const h = Math.floor(min / 60), m = min % 60, parts = [];
      if (h) parts.push(h + ' ч');
      if (m) parts.push(m + ' мин');
      return parts.length ? parts.join(' ') : '0 мин';
    }

    // Секунды -> «2 ч 15 мин»
    function fmtDuration(seconds) {
      const totalMin = Math.max(0, Math.round((parseInt(seconds, 10) || 0) / 60));
      const h = Math.floor(totalMin / 60), m = totalMin % 60, parts = [];
      if (h) parts.push(h + ' ч');
      if (m) parts.push(m + ' мин');
      return parts.length ? parts.join(' ') : 'меньше минуты';
    }

    // ===== Добавление в календарь =====
    const calSheet = document.getElementById('cal-sheet');
    let CAL = null;
    function pad2(n) { return String(n).padStart(2, '0'); }
    function toGCal(epoch) {
      const d = new Date(epoch * 1000);
      return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
        'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
    }
    function openExternal(url) {
      try { if (tg && tg.openLink) { tg.openLink(url); return; } } catch (e) {}
      window.open(url, '_blank');
    }
    function fmtCalWhen(epoch, durMin) {
      const d = new Date(epoch * 1000);
      const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      const t1 = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const t2 = new Date((epoch + (durMin || 60) * 60) * 1000)
        .toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      return dateStr + ', ' + t1 + '–' + t2;
    }
    function openCalendar(id, summary, startEpoch, durationMin, icsToken) {
      CAL = { id, summary, startEpoch, durationMin, icsToken };
      document.getElementById('cal-title').textContent = summary || 'Тренировка';
      document.getElementById('cal-when').textContent = fmtCalWhen(startEpoch, durationMin);
      calSheet.classList.add('is-open');
      haptic('light');
    }
    function closeCalendar() { calSheet.classList.remove('is-open'); }
    document.querySelector('[data-cal-close]').addEventListener('click', closeCalendar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCalendar(); });
    document.getElementById('cal-ics').addEventListener('click', () => {
      if (!CAL) return;
      // Узкий токен из API (не полный initData): ссылка открывается обычной
      // навигацией, где нельзя передать заголовок X-Init-Data.
      let query;
      if (CAL.icsToken) {
        query = '?token=' + encodeURIComponent(CAL.icsToken);
      } else if (DEV_INIT_DATA_ENABLED) {
        query = '?initData=' + encodeURIComponent(INIT_DATA);
      } else {
        toast('Не удалось подготовить ссылку. Обновите страницу.');
        return;
      }
      openExternal(`${location.origin}/calendar/${CAL.id}.ics${query}`);
    });
    document.getElementById('cal-google').addEventListener('click', () => {
      if (!CAL) return;
      const start = toGCal(CAL.startEpoch);
      const end = toGCal(CAL.startEpoch + (CAL.durationMin || 60) * 60);
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: CAL.summary || 'Сквош-тренировка',
        dates: start + '/' + end,
        details: 'Запись через Telegram-бота сквош-тренировок',
      });
      openExternal('https://calendar.google.com/calendar/render?' + params.toString());
    });

    // Подсветка активной вкладки.
    (function () {
      const path = location.pathname.replace(/\/+$/, '') || '/';
      document.querySelectorAll('.tab').forEach(a => {
        const href = a.getAttribute('href');
        if (href === path || (href === '/' && path === '')) a.classList.add('is-active');
      });
    })();

    // Общий профиль. Вкладка «Тренер» видна всем: игрок может оставить заявку.
    const APP = { me: null, ready: (async () => {
      try {
        const data = await api('/api/me');
        APP.me = data.user;
      } catch (e) { /* 401/403 — профиль недоступен */ }
    })() };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
