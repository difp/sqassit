name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Type check
        run: mypy
      - name: Security scan
        run: bandit -r app -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Test failure summary
        if: failure()
        run: |
          python - <<'PY'
          import pathlib

          path = pathlib.Path("pytest.log")
          if path.exists():
              for line in path.read_text(errors="replace").splitlines()[-60:]:
                  print(f"::error::{line}")
          PY
