# Запуск: docker compose up -d --build
#
# ВАЖНО (права на volume): контейнер работает от непривилегированного пользователя
# с UID 1000. Один раз создайте папку данных и выставьте владельца:
#   mkdir -p ./data && sudo chown -R 1000:1000 ./data

services:
  squash-bot:
    build: .
    image: squash-bot:latest
    container_name: squash-bot

    # Политика перезапуска при падении и при перезагрузке сервера.
    restart: always

    # Секреты и настройки берутся из .env (в образ не копируется).
    env_file:
      - .env

    # Бесшовное обновление: БД живёт в ./data и переживает пересборку образа.
    volumes:
      - ./data:/app/data

    ports:
      # По умолчанию слушаем только локально. Публикуйте наружу через reverse-proxy
      # (nginx/caddy) с HTTPS — Telegram Web App требует HTTPS.
      - "127.0.0.1:8000:8000"

    # Проверка живости контейнера.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Даём процессу корректно завершиться (закрыть polling и БД).
    stop_grace_period: 20s

    # Логирование ошибок в стандартный вывод Docker с ротацией.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # --- Дополнительное усиление (DevSecOps) ---
    security_opt:
      - no-new-privileges:true
    read_only: true           # корневая ФС только для чтения
    tmpfs:
      - /tmp                  # временная память без записи на диск
    # Никакого доступа к хосту: нет монтирования docker.sock или корневых папок.
