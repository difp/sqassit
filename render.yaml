services:
  - type: web
    name: sqassit
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: COACH_TELEGRAM_ID
        sync: false
      - key: TIMEZONE
        value: Europe/Moscow
      - key: DB_PATH
        value: /var/data/squash.db
      - key: AVATAR_CACHE_DIR
        value: /var/data/cache/avatars
      - key: BOT_MODE
        value: polling
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: ALLOW_DEV_INIT_DATA
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
    disk:
      name: squash-data
      mountPath: /var/data
      sizeGB: 1
